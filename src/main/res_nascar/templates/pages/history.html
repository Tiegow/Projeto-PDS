<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyNascar - Histórico</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/images/logo.png}">

    <!-- BOOTSTRAP -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/components/highlight.css}">
    <link rel="stylesheet" th:href="@{/css/pages/history.css}">
</head>
<body>
    <div id="header"></div> <!-- O header da página será caregado aqui via JS -->

    <div class="container-fluid text-center my-5">
        <div class="row">
          <aside class="col-4">
            <h3>HIGHLIGHTS</h3>
            <div class="highlights-wrapper">
                <!-- Highlights gerados dinamicamente aqui -->
                <div class="highlight-content mt-4">    
                    <div class="video-highlight">
                        <iframe  
                            width="45%"
                            height="auto"
                            src="https://www.youtube.com/embed/GFd2qsAArk0" 
                            title="YouTube video player" 
                            frameborder="0"  
                            allowfullscreen>
                        </iframe>
                        <div class="video-info text-start">
                            <h5>Título</h5>
                            <p>Descrição breve do vídeo.</p>
                        </div>
                    </div>
                </div>
            </div>
          </aside>
          <section class="col-8 text-start ps-5">
            <div class="history-panel container px-0">
                <div class="dropdown year-dropdown mx-0 px-0">
                    <button id="year-selection" class="btn btn-secondary dropdown-toggle year-dropdown-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                      
                    </button>
                    <ul class="dropdown-menu text-center" id="years-menu">

                    </ul>
                </div>

                <div class="meetings-wrapper container ps-4">
                    <!-- meeting-group carregados aqui -->
                </div>
            </div>
          </section>
        </div>
    </div>

    <script th:src="@{/js/util/countries.js}"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/pages/history.js}"></script>
</body>
</html>
