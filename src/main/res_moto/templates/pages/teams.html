<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyMGP - Times</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/images/logo.png}">

    <!-- BOOTSTRAP -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/components/highlight.css}">
    <link rel="stylesheet" th:href="@{/css/pages/teams.css}">
</head>
<body class="bg-gray-100 font-inter">
<div id="header"></div> <!-- O header da página será caregado aqui via JS -->

<div class="container-fluid my-6">
    <div class="row">
        <aside class="col-md-5">
            <div class="times-lista">
                <h4 class="text-center mb-6 text-gray-800 font-semibold text-2xl">Times</h4>
                <div  id="pilotos-container" class="d-flex flex-wrap">
                </div>
            </div>
        </aside>

        <section class="col-md-7 ps-md-8 mt-6 mt-md-0">
            <div id="times-detalhes">
                <h3 class="text-2xl font-semibold text-gray-800 mb-4">Selecione um time</h3>
                <p class="text-gray-700">Clique no card de um time para ver os detalhes.</p>
            </div>
        </section>
    </div>
</div>



<script th:src="@{/js/util/countries.js}"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/pages/teams.js}"></script>
</body>
</html>
